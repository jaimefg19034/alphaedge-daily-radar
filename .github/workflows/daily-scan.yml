name: AlphaEdge daily stock scan

on:
  schedule:
    - cron: '20 8 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run free scanner
        run: python scripts/update.py
      - name: Commit daily picks
        run: |
          git config user.name "alphaedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "daily scan: update picks"
          git push
