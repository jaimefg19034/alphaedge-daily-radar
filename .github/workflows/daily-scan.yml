
name: AlphaEdge daily stock scan

on:
  schedule:
    # Initial catalyst scan, 8:20 a. m. New York time
    - cron: '20 8 * * 1-5'
      timezone: 'America/New_York'
    # Final refresh, 9:20 a. m. New York time
    - cron: '20 9 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alphaedge-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Add this repository variable in Settings > Secrets and variables > Actions > Variables.
      ALPHAEDGE_CONTACT_EMAIL: ${{ vars.ALPHAEDGE_CONTACT_EMAIL }}
      # Manual runs outside premarket test feeds without overwriting published picks.
      ALPHAEDGE_DIAGNOSTIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run scanner
        run: python -u scripts/update.py
      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ("data/picks.json", "data/history.json"):
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"ERROR: missing {filename}")
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {filename} contains valid JSON")
          PY
      - name: Commit daily picks
        run: |
          git config user.name "alphaedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "daily scan: update picks"
          git push
